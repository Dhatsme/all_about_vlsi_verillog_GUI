name: Base image → GHCR

# Builds docker/base.Dockerfile (all simulation tools, VeeR prebuilt), runs
# aavlsi-selftest inside it, and only then publishes it to
# ghcr.io/<owner>/aavlsi-base. The Railway Dockerfile starts FROM this image.
#
# Runs only when the base image files change, or by hand from the Actions tab.
# A failed build or self-test publishes nothing, so Railway is never affected.

on:
  push:
    branches: [develop]
    paths:
      - 'docker/**'
      - '.github/workflows/base-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: base-image
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the build needs several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Image name and tag
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/aavlsi-base" >> "$GITHUB_OUTPUT"
          echo "tag=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Layer cache in GitHub's Actions cache: a rerun after a small change
      # (e.g. to the self-test) takes minutes instead of rebuilding everything.
      - name: Build base image (~20 min cold, minutes when cached)
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/base.Dockerfile
          tags: aavlsi-base:test
          load: true
          cache-from: type=gha,scope=aavlsi-base
          cache-to: type=gha,scope=aavlsi-base,mode=max

      - name: Self-test (lesson tools + VeeR Lab)
        run: |
          set +e
          docker run --rm aavlsi-base:test aavlsi-selftest > selftest.log 2>&1
          rc=$?
          cat selftest.log
          # Surface failures as annotations (visible on the run page and via the API).
          grep -E "^(PASS|FAIL)  " selftest.log | while read -r line; do
            case "$line" in FAIL*) echo "::error title=self-test::$line";; esac
          done
          if [ $rc -ne 0 ]; then
            echo "::error title=self-test detail::$(grep -v '^PASS' selftest.log | tail -25 | tr '\n' '|' | cut -c1-3500)"
          fi
          exit $rc

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish
        run: |
          IMG="${{ steps.meta.outputs.image }}"
          TAG="${{ steps.meta.outputs.tag }}"
          docker tag aavlsi-base:test "$IMG:$TAG"
          docker tag aavlsi-base:test "$IMG:latest"
          docker push "$IMG:$TAG"
          docker push "$IMG:latest"
          {
            echo "### Published base image"
            echo ""
            echo "\`$IMG:$TAG\` (also tagged \`latest\`)"
            echo ""
            echo "Use it in the Railway Dockerfile: \`ARG BASE_IMAGE=$IMG:$TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
